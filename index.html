<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; font-family: sans-serif; }
        .ludo-board { 
            display: grid; grid-template-columns: repeat(15, 1fr); grid-template-rows: repeat(15, 1fr); 
            width: 90vw; height: 90vw; max-width: 400px; max-height: 400px; background: white; border: 4px solid #333;
        }
        .house { grid-column: span 6; grid-row: span 6; display: flex; flex-wrap: wrap; align-content: space-around; justify-content: space-around; padding: 10px; }
        .red { background: #ff4d4d; } .green { background: #2ecc71; }
        .blue { background: #3498db; } .yellow { background: #f1c40f; }
        .pawn { width: 35%; height: 35%; border-radius: 50%; border: 3px solid rgba(0,0,0,0.2); box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .p-red { background: white; border-color: #ff4d4d; }
        .center { grid-area: 7 / 7 / 10 / 10; background: #ddd; }
        .dice-area { margin-top: 20px; text-align: center; }
        .btn { padding: 15px 30px; background: white; color: black; border: none; border-radius: 10px; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>
    <div id="status">Sıra: Kırmızı</div>
    <div class="ludo-board">
        <div class="house red" style="grid-area: 1/1/7/7;">
            <div class="pawn p-red"></div><div class="pawn p-red"></div>
            <div class="pawn p-red"></div><div class="pawn p-red"></div>
        </div>
        <div class="house green" style="grid-area: 1/10/7/16;"></div>
        <div class="house blue" style="grid-area: 10/1/16/7;"></div>
        <div class="house yellow" style="grid-area: 10/10/16/16;"></div>
        <div class="center"></div>
    </div>
    <div class="dice-area">
        <button class="btn" onclick="roll()">Zar At: <span id="v">?</span></button>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        function roll() {
            const val = Math.floor(Math.random() * 6) + 1;
            document.getElementById('v').innerText = val;
            tg.HapticFeedback.impactOccurred('medium');
        }
    </script>
</body>
</html>
