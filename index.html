<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --r: #ff4d4d; --g: #2ecc71; --b: #3498db; --y: #f1c40f; --bg: #121212; }
        body { margin: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; font-family: sans-serif; overflow: hidden; }
        
        .board { 
            display: grid; grid-template-columns: repeat(15, 1fr); grid-template-rows: repeat(15, 1fr); 
            width: 95vw; height: 95vw; max-width: 450px; max-height: 450px; 
            background: white; border: 4px solid #333; position: relative; 
        }

        /* Bölgeler */
        .house { grid-column: span 6; grid-row: span 6; display: flex; flex-wrap: wrap; align-content: space-around; justify-content: space-around; padding: 10px; border: 1px solid #0002; }
        .red { background: var(--r); } .green { background: var(--g); } .blue { background: var(--b); } .yellow { background: var(--y); }
        
        /* Merkez Bitiş Alanı */
        .center-finish { 
            grid-area: 7/7/10/10; background: #eee; border: 1px solid #000;
            display: flex; align-items: center; justify-content: center; font-size: 10px; color: #333; font-weight: bold;
        }

        /* Hücreler */
        .cell { border: 0.1px solid #ddd; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 8px; }
        
        /* Renkli Koridorlar (Home Stretch) */
        .s-red { background: var(--r) !important; opacity: 0.6; }
        .s-green { background: var(--g) !important; opacity: 0.6; }
        .s-blue { background: var(--b) !important; opacity: 0.6; }
        .s-yellow { background: var(--y) !important; opacity: 0.6; }

        /* Yıldızlı/Güvenli Kareler */
        .safe { background: #e0e0e0; font-weight: bold; }
        .safe::after { content: "★"; color: #777; font-size: 12px; }

        /* Taşlar */
        .pawn { 
            width: 5.5%; height: 5.5%; border-radius: 50%; border: 2px solid rgba(0,0,0,0.5); 
            position: absolute; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            z-index: 100; box-shadow: 0 3px 6px rgba(0,0,0,0.4); 
        }
        .p-red { background: var(--r); } .p-green { background: var(--g); } 
        .p-blue { background: var(--b); } .p-yellow { background: var(--y); }

        .controls { margin-top: 15px; display: flex; align-items: center; gap: 15px; }
        .dice-btn { padding: 12px 25px; background: white; color: black; border-radius: 8px; font-weight: bold; border: none; }
    </style>
</head>
<body>
    <div id="status">Sıra: <span id="turn-text" style="color:var(--r)">KIRMIZI</span></div>
    
    <div class="board" id="ludo-board">
        <div class="house red" style="grid-area: 1/1/7/7;"></div>
        <div class="house green" style="grid-area: 1/10/7/16;"></div>
        <div class="house blue" style="grid-area: 10/1/16/7;"></div>
        <div class="house yellow" style="grid-area: 10/10/16/16;"></div>
        <div class="center-finish">BİTİŞ</div>
    </div>

    <div class="controls">
        <button class="dice-btn" onclick="roll()">🎲 Zar At: <span id="v">?</span></button>
    </div>

    <script>
        const board = document.getElementById('ludo-board');
        
        // 1. TAM TAHTA TASARIMI (Hücreleri oluşturma)
        for(let r=1; r<=15; r++){
            for(let c=1; c<=15; c++){
                // Evlerin ve merkezin içini boş geç, sadece yolları çiz
                if(!((r<7 && c<7) || (r<7 && c>9) || (r>9 && c<7) || (r>9 && c>9) || (r>6 && r<10 && c>6 && c<10))){
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.style.gridArea = `${r}/${c}`;
                    
                    // Renkli koridorları boyama logic'i
                    if(c==8 && r>1 && r<7) cell.classList.add('s-green');
                    if(c==8 && r>9 && r<15) cell.classList.add('s-blue');
                    if(r==8 && c>1 && c<7) cell.classList.add('s-red');
                    if(r==8 && c>9 && c<15) cell.classList.add('s-yellow');
                    
                    // Başlangıç kareleri
                    if(r==7 && c==2) cell.classList.add('safe', 'red-start');
                    if(r==2 && c==9) cell.classList.add('safe', 'green-start');
                    if(r==9 && c==14) cell.classList.add('safe', 'yellow-start');
                    if(r==14 && c==7) cell.classList.add('safe', 'blue-start');

                    board.appendChild(cell);
                }
            }
        }

        // Oyunun beyni (Taşların ve yolların dizisi) buraya gelecek
        // ... (Zar ve hareket fonksiyonları bir öncekiyle benzer ama gelişmiş olacak)
    </script>
</body>
</html>
