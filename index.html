<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --r: #ff3232; --g: #28c76f; --b: #1e90ff; --y: #f9ca24; --bg: #121212; }
        body { margin: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
        
        .board { 
            display: grid; grid-template-columns: repeat(15, 1fr); grid-template-rows: repeat(15, 1fr); 
            width: 95vw; height: 95vw; max-width: 450px; max-height: 450px; 
            background: #fff; border: 4px solid #333; position: relative;
        }

        .house { grid-column: span 6; grid-row: span 6; display: flex; align-items: center; justify-content: center; border: 1px solid #000; }
        .h-inner { width: 75%; height: 75%; background: white; border-radius: 10px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; padding: 10px; border: 1px solid #ddd; }
        
        .red { background: var(--r); } .blue { background: var(--b); } .yellow { background: var(--y); } .green { background: var(--g); }

        .center { grid-area: 7/7/10/10; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; border: 1px solid #000; background: #eee; }
        .tri { width: 0; height: 0; border-style: solid; }
        .tri-r { border-width: 33px 0 33px 33px; border-color: transparent transparent transparent var(--r); grid-area: 1/1/3/2; }
        .tri-b { border-width: 33px 33px 0 33px; border-color: var(--b) transparent transparent transparent; grid-area: 1/1/2/3; }
        .tri-y { border-width: 33px 33px 33px 0; border-color: transparent var(--y) transparent transparent; grid-area: 1/2/3/3; }
        .tri-g { border-width: 0 33px 33px 33px; border-color: transparent transparent var(--g) transparent; grid-area: 2/1/3/3; }

        .cell { border: 0.1px solid #ddd; box-sizing: border-box; display: flex; align-items: center; justify-content: center; position: relative; }
        
        /* İSTEDİĞİN RENKLİ BAŞLANGIÇ KARELERİ */
        .start-red { background: var(--r) !important; }
        .start-blue { background: var(--b) !important; }
        .start-yellow { background: var(--y) !important; }
        .start-green { background: var(--g) !important; }

        /* Bitiş Yolları */
        .path-red { background: var(--r); opacity: 0.8; }
        .path-blue { background: var(--b); opacity: 0.8; }
        .path-yellow { background: var(--y); opacity: 0.8; }
        .path-green { background: var(--g); opacity: 0.8; }

        .pawn { 
            width: 80%; height: 80%; border-radius: 50%; border: 2px solid rgba(0,0,0,0.3); 
            box-shadow: 0 3px 5px rgba(0,0,0,0.4); cursor: pointer; transition: all 0.2s;
        }
        .p-red { background: var(--r); } .p-blue { background: var(--b); } 
        .p-yellow { background: var(--y); } .p-green { background: var(--g); }

        .controls { margin-top: 15px; }
        .dice-btn { padding: 12px 30px; background: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; box-shadow: 0 4px #888; }
    </style>
</head>
<body>
    <div id="status" style="margin-bottom:10px; color:white;">Sıra: <span id="turn-text" style="color:var(--r); font-weight:bold;">KIRMIZI</span></div>
    
    <div class="board" id="ludo-board">
        <div class="house red" style="grid-area: 1/1/7/7;"><div class="h-inner" id="h-red"></div></div>
        <div class="house blue" style="grid-area: 1/10/7/16;"><div class="h-inner" id="h-blue"></div></div>
        <div class="house green" style="grid-area: 10/1/16/7;"><div class="h-inner" id="h-green"></div></div>
        <div class="house yellow" style="grid-area: 10/10/16/16;"><div class="h-inner" id="h-yellow"></div></div>
        <div class="center"><div class="tri-r"></div><div class="tri-b"></div><div class="tri-y"></div><div class="tri-g"></div></div>
    </div>

    <div class="controls">
        <button class="dice-btn" onclick="roll()">🎲 Zar At: <span id="dice-v">?</span></button>
    </div>

    <script>
        const board = document.getElementById('ludo-board');
        const colors = ['red', 'blue', 'yellow', 'green'];
        let turn = 0, lastDice = 0, canRoll = true;

        // Koordinat Haritası (Sırayla tüm yol)
        const pathCoords = []; 
        // Burada yolu manuel çizmek yerine hücreleri oluştururken renklere göre atama yapıyoruz

        function buildBoard() {
            for(let r=1; r<=15; r++){
                for(let c=1; c<=15; c++){
                    if(!((r<7 && c<7) || (r<7 && c>9) || (r>9 && c<7) || (r>9 && c>9) || (r>6 && r<10 && c>6 && c<10))){
                        const cell = document.createElement('div');
                        cell.className = 'cell'; cell.id = `c-${r}-${c}`;
                        cell.style.gridArea = `${r}/${c}`;
                        
                        // Koridor Renkleri
                        if(r==8 && c>1 && c<7) cell.classList.add('path-red');
                        if(c==8 && r>1 && r<7) cell.classList.add('path-blue');
                        if(r==8 && c>9 && c<15) cell.classList.add('path-yellow');
                        if(c==8 && r>9 && r<15) cell.classList.add('path-green');

                        // BAŞLANGIÇ KARELERİ (İSTEDİĞİN GİBİ RENKLİ)
                        if(r==7 && c==2) cell.classList.add('start-red');
                        if(r==2 && c==9) cell.classList.add('start-blue');
                        if(r==9 && c==14) cell.classList.add('start-yellow');
                        if(r==14 && c==7) cell.classList.add('start-green');

                        board.appendChild(cell);
                    }
                }
            }
        }

        let pawns = [];
        colors.forEach(c => {
            for(let i=0; i<4; i++) {
                const p = { id: `${c}-${i}`, color: c, pos: -1 };
                pawns.push(p);
                const pEl = document.createElement('div');
                pEl.className = `pawn p-${c}`; pEl.id = p.id;
                pEl.onclick = () => movePawn(p);
                document.getElementById('h-'+c).appendChild(pEl);
            }
        });

        window.roll = function() {
            if(!canRoll) return;
            lastDice = Math.floor(Math.random() * 6) + 1;
            document.getElementById('dice-v').innerText = lastDice;
            canRoll = false;
            // Hareket edemiyorsa sırayı geç (Basit mantık)
            const canMove = pawns.some(p => p.color === colors[turn] && (p.pos !== -1 || lastDice === 6));
            if(!canMove) setTimeout(nextTurn, 1000);
        };

        function movePawn(p) {
            if(p.color !== colors[turn] || lastDice === 0) return;
            
            // Yuvadan Çıkış (6 ile)
            if(p.pos === -1 && lastDice === 6) {
                const startCells = { red:'c-7-2', blue:'c-2-9', yellow:'c-9-14', green:'c-14-7' };
                const cell = document.getElementById(startCells[p.color]);
                cell.appendChild(document.getElementById(p.id));
                p.pos = 0; // Başlangıç noktası
                finishMove();
            }
        }

        function finishMove() {
            if(lastDice !== 6) nextTurn();
            else { lastDice = 0; canRoll = true; document.getElementById('dice-v').innerText = "6! Tekrar"; }
        }

        function nextTurn() {
            turn = (turn + 1) % 4;
            lastDice = 0; canRoll = true;
            document.getElementById('dice-v').innerText = "?";
            const t = document.getElementById('turn-text');
            t.innerText = colors[turn].toUpperCase();
            t.style.color = `var(--${colors[turn][0]})`;
        }

        buildBoard();
    </script>
</body>
</html>
