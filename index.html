<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --r: #ff4d4d; --g: #2ecc71; --b: #3498db; --y: #f1c40f; }
        body { margin: 0; background: #1a1a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; font-family: sans-serif; overflow: hidden; }
        .board { display: grid; grid-template-columns: repeat(15, 1fr); grid-template-rows: repeat(15, 1fr); width: 95vw; height: 95vw; max-width: 450px; max-height: 450px; background: white; border: 4px solid #333; position: relative; }
        .house { grid-column: span 6; grid-row: span 6; display: flex; flex-wrap: wrap; align-content: space-around; justify-content: space-around; padding: 10px; border: 1px solid #0002; }
        .red { background: var(--r); } .green { background: var(--g); }
        .blue { background: var(--b); } .yellow { background: var(--y); }
        .center { grid-area: 7/7/10/10; background: #ddd; border: 1px solid #000; }
        
        /* Taş Tasarımı */
        .pawn { width: 35%; height: 35%; border-radius: 50%; border: 3px solid rgba(0,0,0,0.3); box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.2s; }
        .p-red { background: var(--r); } .p-green { background: var(--g); }
        .p-blue { background: var(--b); } .p-yellow { background: var(--y); }
        
        /* Yol Kareleri */
        .cell { border: 0.1px solid #ccc; box-sizing: border-box; }
        .dice-btn { margin-top: 15px; padding: 12px 25px; background: white; color: black; border-radius: 8px; font-weight: bold; border: none; box-shadow: 0 4px 0 #999; }
    </style>
</head>
<body>
    <div id="status">Sıra: <span id="turn" style="color:var(--r)">Kırmızı</span></div>
    <div class="board" id="ludo-board">
        <div class="house red" style="grid-area: 1/1/7/7;">
            <div class="pawn p-red"></div><div class="pawn p-red"></div>
            <div class="pawn p-red"></div><div class="pawn p-red"></div>
        </div>
        <div class="house green" style="grid-area: 1/10/7/16;">
            <div class="pawn p-green"></div><div class="pawn p-green"></div>
            <div class="pawn p-green"></div><div class="pawn p-green"></div>
        </div>
        <div class="house blue" style="grid-area: 10/1/16/7;">
            <div class="pawn p-blue"></div><div class="pawn p-blue"></div>
            <div class="pawn p-blue"></div><div class="pawn p-blue"></div>
        </div>
        <div class="house yellow" style="grid-area: 10/10/16/16;">
            <div class="pawn p-yellow"></div><div class="pawn p-yellow"></div>
            <div class="pawn p-yellow"></div><div class="pawn p-yellow"></div>
        </div>
        <div class="center"></div>
    </div>
    <button class="dice-btn" onclick="roll()">🎲 Zar At: <span id="v">?</span></button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Beyaz yol karelerini oluşturma (Grid sistemi üzerine)
        const board = document.getElementById('ludo-board');
        for(let r=1; r<=15; r++){
            for(let c=1; c<=15; c++){
                // Sadece yolların olduğu koordinatlara boş hücre ekle
                if(!((r<7 && c<7) || (r<7 && c>9) || (r>9 && c<7) || (r>9 && c>9) || (r>6 && r<10 && c>6 && c<10))){
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.style.gridArea = `${r}/${c}`;
                    board.appendChild(cell);
                }
            }
        }

        function roll() {
            const v = Math.floor(Math.random() * 6) + 1;
            document.getElementById('v').innerText = v;
            tg.HapticFeedback.impactOccurred('light');
        }
    </script>
</body>
</html>
